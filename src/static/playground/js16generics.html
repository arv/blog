<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01//EN">
<html>
<title>JS 1.6 Array and String Generics</title>
<script type="text/javascript" src="js16generics.js"></script>
<body>
<script type="text/javascript">

var arrayLike = {0: 3, 1: 2, 2: 1, 3: 0, length: 4};
Array.sort(arrayLike);
document.write(Array.join(arrayLike, "<br>"));

window.onload = function () {
	var all = document.getElementsByTagName("*");
	alert(Array.filter(all, function (el) {
		return String.toLowerCase(el.tagName) == "script";
	}).map(function (el) {
		return el.tagName + ", src: " + el.src;
	}).join("\n"));
};

</script>
