function readTextFile(sUri) {
	var xmlHttp;
	if (window.XMLHttpRequest) {
		xmlHttp = new XMLHttpRequest;
	} else if (window.ActiveXObject) {
		xmlHttp = new ActiveXObject("Microsoft.XMLHTTP");
	}
	xmlHttp.open("GET", sUri, false);
	xmlHttp.send(null);
	return xmlHttp.responseText;
}

<p id="tunage"></p>

<script type="text/javascript">
	
var te = new TemplateEngine(readTextFile("tunagetemplate.txt"));

var uri = document.domain == "erik.eae.net" ? "http://erik.eae.net/playground/tunage/currentlyplaying.js" : "currentlyplaying.js";
el.innerHTML = te.evaluate(null, readTextFile(uri));

	el.innerHTML = te.evaluate(null, readTextFile(uri));
}, 60000);
